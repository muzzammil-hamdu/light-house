name: Build and Push to Docker Hub

on:
  push:
    branches: [ main ]

env:
  IMAGE_NAME: mujju752/light-house

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build project
        run: |
          npm ci
          npm run build

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # optionally set platforms: linux/amd64,linux/arm64

      - name: Update kustomize image tag with commit SHA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          yq eval -i '.images[0].newTag = env(GITHUB_SHA)' k8s/kustomization.yaml
          yq eval -i '.images[0].name = env(IMAGE_NAME)' k8s/kustomization.yaml
          git add k8s/kustomization.yaml
          git commit -m "ci: update kustomize image to $GITHUB_SHA" || echo "no changes to commit"
          git push origin HEAD:main
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GITHUB_SHA: ${{ github.sha }}
